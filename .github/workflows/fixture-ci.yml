name: Fixture CI
on:
  push:
    branches: [main, 'dev-feature-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixture-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-tests:
    name: fixture-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-23
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, verified 2026-10-23
        with:
          node-version: '24.22.1'
      - name: Unit tests
        run: node --test test/*.test.mjs
